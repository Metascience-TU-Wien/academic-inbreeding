[data]
researcher_file_path = "data/test/synthetic/researchers.csv"
candidate_authors_file = "data/test/synthetic/scopus_authors.csv"
article_author_file_path = "data/test/synthetic/article_authors.csv"
article_reference_file_path = "data/test/synthetic/article_references.csv"
author_affiliations_file_path = "data/test/synthetic/author_affiliations.gpkg"

[name_matching]
enable_given_name_aliases = true
# Fictional organizations are not present in the production affiliation mapping.
enable_organisation_filter = false
existing_scopus_author_id_column = "scopus_author_id"
max_workers = 3

[name_matching.outputs]
directory = "data/output/synthetic/name_matching"

[name_disambiguation]
enable_reporting = false
same_author_score_threshold = 6.0
possible_author_score_threshold = 3.0
max_workers = 1

[name_disambiguation.outputs]
directory = "data/output/synthetic/name_disambiguation"

# The synthetic mobility fixtures include their own fictional GeoPackage map.
[mobility]
enable_university_affiliation_inbreeding_detection = false
enable_coaffiliated_professor_merge = true
professor_title_pattern = "prof"
min_publication_history_years = 3
max_workers = 1

[mobility.outputs]
directory = "data/output/synthetic/mobility"

[regression]
mle_failure_policy = "error"
mle_gradient_tolerance = 0.0001
print_model_summaries = true
drop_missing = true
min_publications = 1
professor_title_pattern = "prof"
exclude_titles = []
rebuild_input = false

[regression.dependent_variables]
hazen_perc_med = "olshc3"
pp_top_10 = "olshc3"
pp_top_5 = "olshc3"
pp_top_1 = "olshc3"
P_top10 = "olshc3"
P_top5 = "olshc3"
P_top1 = "olshc3"
n_public = "nb"

[regression.outcome_metadata.hazen_perc_med]
outcome_type = "relative"
alias = "mwPR"

[regression.outcome_metadata.pp_top_10]
outcome_type = "relative"
alias = "PP(top 10%)"

[regression.outcome_metadata.pp_top_5]
outcome_type = "relative"
alias = "PP(top 5%)"

[regression.outcome_metadata.pp_top_1]
outcome_type = "relative"
alias = "PP(top 1%)"

[regression.outcome_metadata.P_top10]
outcome_type = "absolute"
alias = "P(top 10%)"

[regression.outcome_metadata.P_top5]
outcome_type = "absolute"
alias = "P(top 5%)"

[regression.outcome_metadata.P_top1]
outcome_type = "absolute"
alias = "P(top 1%)"

[regression.outcome_metadata.n_public]
outcome_type = "absolute"
alias = "Publications"

[regression.outputs]
directory = "data/output/synthetic/regression"

[statistical_matching]
outcomes = ["hazen_perc_med", "pp_top_10", "pp_top_5", "pp_top_1", "n_public", "P_top10", "P_top5", "P_top1"]
covariates = ["academic_age", "title", "first_year", "life_sci_share", "health_sci_share", "soc_hum_share", "multi_area_share"]
methods = ["PSM", "IPTW", "CEM", "EB"]
treatment_variable = "is_inbred"
treated_value = true
estimand = "ATT"
exclude_titles = ["FH-Ass. Prof."]
balance_threshold = 0.10
covariance_type = "HC3"
drop_missing = true

[statistical_matching.cem_cutpoints]
academic_age = [5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 35.0, 40.0]
first_year = [1980.0, 1990.0, 2000.0, 2005.0, 2010.0, 2015.0, 2020.0]
life_sci_share = [0.0, 0.25, 0.5, 0.75, 1.0]
health_sci_share = [0.0, 0.25, 0.5, 0.75, 1.0]
soc_hum_share = [0.0, 0.25, 0.5, 0.75, 1.0]
multi_area_share = [0.0, 0.25, 0.5, 0.75, 1.0]

[statistical_matching.outputs]
directory = "data/output/synthetic/statistical_matching"
