# Small, fully synthetic example for name matching and disambiguation.
# Run with: uv run run-acib-pipeline --config config/pipeline.synthetic.toml

[data]
researcher_file_path = "data/test/synthetic/researchers.csv"
candidate_authors_file = "data/test/synthetic/scopus_authors.csv"
article_author_file_path = "data/test/synthetic/article_authors.csv"
article_reference_file_path = "data/test/synthetic/article_references.csv"

[name_matching]
resolved_matches_output_file_path = "data/test/synthetic/output/resolved_researchers.csv"
enable_given_name_aliases = true
enable_organisation_filter = false
existing_scopus_author_id_column = "scopus_author_id"
max_workers = 1

[name_disambiguation]
enable_reporting = false
same_author_score_threshold = 6.0
possible_author_score_threshold = 3.0
max_workers = 1

[name_disambiguation.outputs]
pair_decisions = "data/test/synthetic/output/pair_decisions.csv"
clusters = "data/test/synthetic/output/clusters.csv"
final_author_selection = "data/test/synthetic/output/final_author_selection.csv"
final_author_selection_scores = "data/test/synthetic/output/final_author_selection_scores.csv"
report_txt = "data/test/synthetic/output/report.txt"
report_jsonl = "data/test/synthetic/output/report.jsonl"
