name: Publish container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic-version tag to publish (for example, v0.9.0)
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/metascience-tu-wien/academic-inbreeding

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Run test suite
        run: |
          uv sync --frozen
          uv run pytest --import-mode=importlib -q

  publish:
    needs: test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_type == 'branch' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release or development tags
        id: tags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "push" || -n "$RELEASE_TAG" ]]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a semantic version tag such as v0.1.0 or v0.1.0-rc.1" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
            major_minor="${version%-*}"
            major_minor="${major_minor%.*}"
            {
              echo "tags<<EOF"
              echo "$IMAGE:$version"
              if [[ "$version" != *-* ]]; then
                echo "$IMAGE:$major_minor"
                echo "$IMAGE:latest"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            # Stable patch-version tags are immutable release identifiers.
            if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing release image $IMAGE:$version" >&2
              exit 1
            fi
          else
            version="dev-${COMMIT_SHA:0:12}"
            echo "tags=$IMAGE:$version" >> "$GITHUB_OUTPUT"
            if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing development image $IMAGE:$version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Metascience-TU-Wien/academic-inbreeding
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
